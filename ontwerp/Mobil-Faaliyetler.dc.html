<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Faaliyetler – mobil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Noto+Kufi+Arabic:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
@keyframes nzRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F6F1E7; color: #14295A; font-family: 'Hanken Grotesk', 'Segoe UI', system-ui, sans-serif">

  <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 76px; overflow-y: auto; padding: 22px 18px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Bodoni Moda', Georgia, serif; font-weight: 600; font-size: 36px; line-height: 1.05; letter-spacing: -0.01em">Faaliyetler</h1>
      <p style="margin: 0; font-size: 14.5px; color: #4E5B76">Camimizde yaklaşan etkinlikler</p>
    </div>

    <div role="group" aria-label="Kategoriye göre süz" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -18px; padding: 0 18px 2px">
      <sc-for list="{{chips}}" as="chip" hint-placeholder-count="5">
        <button type="button" aria-pressed="{{chip.pressed}}" onClick="{{chip.pick}}" style="flex: 0 0 auto; height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid {{chip.border}}; background: {{chip.bg}}; color: {{chip.fg}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{chip.label}}</button>
      </sc-for>
    </div>

    <article style="position: relative; display: flex; gap: 16px; padding: 16px; border-radius: 22px; background: #14295A; color: #F6F1E7; overflow: hidden; animation: nzRise .5s both">
      <svg aria-hidden="true" width="220" height="220" viewBox="0 0 48 48" style="position: absolute; right: -50px; top: -60px; opacity: 0.14">
        <g fill="none" stroke="#E8C27A" stroke-width="0.6">
          <rect x="14" y="14" width="20" height="20"></rect>
          <rect x="14" y="14" width="20" height="20" transform="rotate(45 24 24)"></rect>
          <circle cx="24" cy="24" r="6"></circle>
        </g>
      </svg>
      <div style="position: relative; flex: 0 0 auto; width: 76px; height: 96px">
        <svg aria-hidden="true" width="76" height="96" viewBox="0 0 76 96" style="position: absolute; left: 0; top: 0">
          <path d="M2 94 V44 A50 50 0 0 1 38 2 A50 50 0 0 1 74 44 V94 Z" fill="#F6F1E7"></path>
        </svg>
        <div style="position: absolute; left: 0; right: 0; top: 26px; display: flex; flex-direction: column; align-items: center; color: #14295A">
          <span style="font-family: 'Bodoni Moda', Georgia, serif; font-weight: 600; font-size: 34px; line-height: 1; font-variant-numeric: lining-nums">31</span>
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; margin-top: 3px">EKİM</span>
          <span style="font-size: 11px; color: #4E5B76; margin-top: 1px">Cumartesi</span>
        </div>
      </div>
      <div style="position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0">
        <span style="align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #E8C27A">SIRADAKİ FAALİYET</span>
        <h2 style="margin: 0; font-family: 'Bodoni Moda', Georgia, serif; font-weight: 600; font-size: 23px; line-height: 1.15">Aile Kahvaltısı</h2>
        <span style="font-size: 14px; color: #D4DBEA">10:00 – 12:30 · Konferans salonu</span>
        <div style="display: flex; gap: 8px; margin-top: 8px">
          <button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #E8C27A; color: #14295A; font-family: inherit; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4M12 13v5M9.5 15.5h5"></path></svg>
            Takvime ekle
          </button>
          <button type="button" aria-label="Paylaş" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(246,241,231,0.35); background: transparent; color: #F6F1E7; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7.5 7.5L12 3l4.5 4.5"></path><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path></svg>
          </button>
        </div>
      </div>
    </article>

    <div style="display: flex; align-items: center; gap: 10px; margin-top: 4px">
      <span style="font-size: 11.5px; font-weight: 700; letter-spacing: 0.16em">KASIM 2026</span>
      <span style="flex: 1; height: 1px; background: rgba(168,132,58,0.45)"></span>
    </div>

    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{events}}" as="ev" hint-placeholder-count="4">
        <li style="animation: nzRise .5s {{ev.delay}} both">
          <a href="#" style="display: flex; align-items: center; gap: 14px; padding: 12px 12px 12px 12px; border-radius: 18px; background: #FFFDF8; border: 1px solid #E3D8C4; min-height: 76px; box-sizing: border-box">
            <span style="position: relative; flex: 0 0 auto; width: 48px; height: 60px">
              <svg aria-hidden="true" width="48" height="60" viewBox="0 0 48 60" style="position: absolute; left: 0; top: 0">
                <path d="M1.5 58.5 V28 A32 32 0 0 1 24 1.5 A32 32 0 0 1 46.5 28 V58.5 Z" fill="none" stroke="{{ev.color}}" stroke-width="1.5"></path>
              </svg>
              <span style="position: absolute; left: 0; right: 0; top: 19px; display: flex; flex-direction: column; align-items: center">
                <span style="font-family: 'Bodoni Moda', Georgia, serif; font-weight: 600; font-size: 21px; line-height: 1; font-variant-numeric: lining-nums">{{ev.day}}</span>
                <span style="font-size: 9.5px; font-weight: 700; letter-spacing: 0.12em; margin-top: 3px">{{ev.mon}}</span>
              </span>
            </span>
            <span style="display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0">
              <span style="font-weight: 700; font-size: 16px">{{ev.title}}</span>
              <span style="font-size: 13.5px; color: #4E5B76">{{ev.meta}}</span>
              <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: {{ev.color}}">
                <span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 2px; transform: rotate(45deg); background: {{ev.color}}"></span>{{ev.cat}}
              </span>
            </span>
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4E5B76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
          </a>
        </li>
      </sc-for>
    </ul>
    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <p style="margin: 8px 0 0; font-size: 14.5px; color: #4E5B76; text-align: center">Bu kategoride yaklaşan faaliyet yok.</p>
    </sc-if>
  </div>

  <nav aria-label="Ana menü" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; box-sizing: border-box; padding: 6px 10px 14px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: rgba(250,247,240,0.96); border-top: 1px solid #E3D8C4">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #4E5B76; font-size: 11.5px; font-weight: 600">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V11.5a7 7 0 0 1 7-8 7 7 0 0 1 7 8V21"></path><path d="M9.5 21v-5a2.5 2.5 0 0 1 5 0v5"></path><path d="M3 21h18"></path></svg>
      <span>Ana ekran</span>
      <span aria-hidden="true" style="width: 4px; height: 4px"></span>
    </a>
    <a href="Mobil-Faaliyetler.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #1F46A6; font-size: 11.5px; font-weight: 700">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path><path d="M12 12.6l1 2 2.2.3-1.6 1.5.4 2.2-2-1.1-2 1.1.4-2.2-1.6-1.5 2.2-.3z"></path></svg>
      <span>Faaliyetler</span>
      <span aria-hidden="true" style="width: 4px; height: 4px; border-radius: 50%; background: #B5432B"></span>
    </a>
    <a href="Mobil-Programlar.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #4E5B76; font-size: 11.5px; font-weight: 600">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
      <span>Programlar</span>
      <span aria-hidden="true" style="width: 4px; height: 4px"></span>
    </a>
    <a href="Mobil-Ayarlar.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #4E5B76; font-size: 11.5px; font-weight: 600">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
      <span>Ayarlar</span>
      <span aria-hidden="true" style="width: 4px; height: 4px"></span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'Tümü' };
  }
  renderVals() {
    const colors = { 'Genel': '#1F46A6', 'Gençlik': '#0B6E6A', 'Hanımlar': '#B5432B', 'Çocuklar': '#8A6420' };
    const all = [
      { day: '07', mon: 'KAS', title: 'Gençlik Buluşması', meta: 'Cumartesi 19:30 · Konferans salonu', cat: 'Gençlik' },
      { day: '15', mon: 'KAS', title: 'Kermes', meta: 'Pazar 11:00 – 17:00 · Cami avlusu', cat: 'Genel' },
      { day: '21', mon: 'KAS', title: 'Hanımlar Sohbeti', meta: 'Cumartesi 14:00 · Kadınlar bölümü', cat: 'Hanımlar' },
      { day: '22', mon: 'KAS', title: 'Çocuklar Kur’an Yarışması', meta: 'Pazar 13:00 · Ana salon', cat: 'Çocuklar' },
      { day: '27', mon: 'KAS', title: 'Hatim Duası', meta: 'Cuma · Yatsı namazından sonra', cat: 'Genel' }
    ];
    const cat = this.state.cat;
    const list = all.filter((e) => cat === 'Tümü' || e.cat === cat);
    const events = list.map((e, i) => ({ ...e, color: colors[e.cat], delay: (0.06 * (i + 1)).toFixed(2) + 's' }));
    const chips = ['Tümü', 'Genel', 'Gençlik', 'Hanımlar', 'Çocuklar'].map((c) => {
      const on = c === cat;
      return {
        label: c, pressed: on ? 'true' : 'false',
        bg: on ? '#14295A' : '#FFFDF8', fg: on ? '#F6F1E7' : '#14295A', border: on ? '#14295A' : '#E3D8C4',
        pick: () => this.setState({ cat: c })
      };
    });
    return { chips, events, empty: events.length === 0 };
  }
}
</script>
</body>
</html>
