<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Noto+Kufi+Arabic:wght@400;600&amp;display=swap" rel="stylesheet">

.nz-tw{animation:nzTwinkle 4s ease-in-out infinite}
.nz-tw2{animation:nzTwinkle 5.5s ease-in-out infinite 1.2s}
@media (prefers-reduced-motion: reduce){.nz-tw,.nz-tw2{animation:none}}
</style>

  <svg aria-hidden="true" width="390" height="300" viewBox="0 0 390 300" style="position: absolute; left: 0; top: 0; opacity: 0.12">

  <div style="position: relative; display: flex; flex-direction: column; padding: 14px 18px 0">

    <header style="display: flex; align-items: center; gap: 12px; height: 44px">

      <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">

    <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px">

      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.18em">ZATERDAG · 24 OKTOBER 2026</span>
        <span style="font-family: 'Bodoni Moda', Georgia, serif; font-style: italic; font-size: 15px; color: #A9B5CF">13 Jumada al-Awwal 1448</span>
      </div>
      <span style="flex: 1; height: 1px; background: rgba(232,194,122,0.4)"></span>
    </div>

    <div style="position: relative; width: 264px; height: 316px; margin: 4px auto 0">
      <svg aria-hidden="true" width="264" height="316" viewBox="0 0 300 360" style="position: absolute; left: 0; top: 0; overflow: visible">
        <defs>
          <linearGradient id="nzSkyNl" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1A2E61"></stop>

        <g fill="#F3EEE3">
          <circle class="nz-tw" cx="88" cy="96" r="1.4"></circle>
          <circle class="nz-tw2" cx="212" cy="84" r="1.2"></circle>
          <circle class="nz-tw" cx="62" cy="168" r="1"></circle>
          <circle class="nz-tw2" cx="240" cy="190" r="1.3"></circle>
          <circle class="nz-tw" cx="128" cy="120" r="0.9"></circle>
          <circle class="nz-tw2" cx="186" cy="138" r="1"></circle>
        </g>
        <path d="M26 348 V202 A180 180 0 0 1 150 28.9 A180 180 0 0 1 274 202 V348" fill="none" stroke="rgba(232,194,122,0.4)" stroke-width="1"></path>
        <path d="M16 348 V200 A190 190 0 0 1 150 18.4 A190 190 0 0 1 284 200 V348" pathLength="1000" fill="none" stroke="rgba(232,194,122,0.4)" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"></path>
        <path d="M16 348 V200 A190 190 0 0 1 150 18.4 A190 190 0 0 1 284 200 V348" pathLength="1000" fill="none" stroke="#E8C27A" stroke-width="3" stroke-dasharray="965 1000" stroke-linecap="round"></path>
        <g transform="translate(150 70)" fill="none" stroke="#E8C27A" stroke-width="1.2">
          <rect x="-9" y="-9" width="18" height="18"></rect>
          <rect x="-9" y="-9" width="18" height="18" transform="rotate(45)"></rect>
        </g>
        <g fill="#E8C27A" stroke="#1A2E61" stroke-width="2">
          <circle cx="16" cy="348" r="5"></circle>
          <circle cx="16" cy="303.4" r="5"></circle>
          <circle cx="16" cy="246.4" r="5"></circle>
          <circle cx="160.3" cy="22" r="5"></circle>
          <circle cx="263.4" cy="114" r="5"></circle>
          <circle cx="284" cy="257.8" r="5"></circle>
        </g>
        <circle cx="284" cy="348" r="9" fill="#0F1F45" stroke="#F08B6E" stroke-width="2.5"></circle>
        <circle cx="284" cy="348" r="3.5" fill="#F08B6E"></circle>
        <circle cx="284" cy="321" r="17" fill="#E8C27A" opacity="0.14"></circle>
        <circle cx="284" cy="321" r="10" fill="#E8C27A"></circle>
        <circle cx="288.5" cy="317.5" r="8.5" fill="#12234D"></circle>
      </svg>

      <div style="position: absolute; left: 0; right: 0; top: 136px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center">
        <span style="font-size: 11.5px; font-weight: 700; letter-spacing: 0.16em; color: #F08B6E">NOG TOT ISJA</span>
        <span style="font-family: 'Bodoni Moda', Georgia, serif; font-weight: 500; font-size: 54px; line-height: 1.04; font-variant-numeric: lining-nums tabular-nums; letter-spacing: -0.01em">{{countdown}}</span>
        <span style="display: flex; align-items: baseline; gap: 8px; margin-top: 2px">
          <span style="font-weight: 600; font-size: 16px">Isja</span>
          <span style="font-family: 'Bodoni Moda', Georgia, serif; font-size: 18px; font-variant-numeric: lining-nums">20:09</span>
        </span>
        <span lang="ar" dir="rtl" style="font-family: 'Noto Kufi Arabic', serif; font-size: 13px; color: #A9B5CF">العشاء</span>
      </div>
    </div>

    <ul aria-label="Gebedstijden van vandaag" style="list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column">
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="7">
        <li style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px; border-radius: 12px; background: {{row.bg}}; box-shadow: {{row.shadow}}; animation: nzRise .5s {{row.delay}} both">
          <span aria-hidden="true" style="width: 14px; display: flex; justify-content: center">
            <sc-if value="{{row.isNext}}" hint-placeholder-val="{{false}}">
              <svg width="12" height="12" viewBox="0 0 16 16"><g fill="#F08B6E"><rect x="3" y="3" width="10" height="10"></rect><rect x="3" y="3" width="10" height="10" transform="rotate(45 8 8)"></rect></g></svg>
            </sc-if>
            <sc-if value="{{row.isNow}}" hint-placeholder-val="{{false}}">
              <span style="width: 8px; height: 8px; border-radius: 50%; background: #5CC9BF"></span>
            </sc-if>
          </span>
          <span style="display: flex; align-items: baseline; gap: 8px; flex: 1; min-width: 0">
            <span style="font-weight: 600; font-size: 16px; color: {{row.color}}">{{row.name}}</span>
            <span lang="ar" dir="rtl" style="font-family: 'Noto Kufi Arabic', serif; font-size: 12px; color: #A9B5CF">{{row.ar}}</span>
            <sc-if value="{{row.isNow}}" hint-placeholder-val="{{false}}">
              <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #5CC9BF">NU</span>
            </sc-if>
          </span>
          <span style="font-family: 'Bodoni Moda', Georgia, serif; font-size: 21px; font-weight: 500; font-variant-numeric: lining-nums tabular-nums; color: {{row.color}}">{{row.time}}</span>
          <button type="button" aria-label="{{row.bellLabel}}" aria-pressed="{{row.bellOn}}" onClick="{{row.toggle}}" style="width: 44px; height: 44px; margin-right: -8px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; color: {{row.bellColor}}">
            <sc-if value="{{row.bellOff}}" hint-placeholder-val="{{false}}">
              <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path><path d="M3 3l18 18"></path></svg>
            </sc-if>
            <sc-if value="{{row.bellOnFlag}}" hint-placeholder-val="{{true}}">
              <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
            </sc-if>
          </button>
        </li>
      </sc-for>
    </ul>
  </div>

  <nav aria-label="Hoofdmenu" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; box-sizing: border-box; padding: 6px 10px 14px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: rgba(12,24,52,0.96); border-top: 1px solid rgba(232,194,122,0.16)">
    <a href="Mobil-Gece-NL.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A9C1FA; font-size: 11.5px; font-weight: 700">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V11.5a7 7 0 0 1 7-8 7 7 0 0 1 7 8V21"></path><path d="M9.5 21v-5a2.5 2.5 0 0 1 5 0v5"></path><path d="M3 21h18"></path></svg>
      <span>Home</span>
      <span aria-hidden="true" style="width: 4px; height: 4px; border-radius: 50%; background: #F08B6E"></span>
    </a>
    <a href="Mobil-Faaliyetler.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A9B5CF; font-size: 11.5px; font-weight: 600">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path><path d="M12 12.6l1 2 2.2.3-1.6 1.5.4 2.2-2-1.1-2 1.1.4-2.2-1.6-1.5 2.2-.3z"></path></svg>
      <span>Activiteiten</span>
      <span aria-hidden="true" style="width: 4px; height: 4px"></span>
    </a>
    <a href="Mobil-Programlar.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A9B5CF; font-size: 11.5px; font-weight: 600">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
      <span>Programma’s</span>
      <span aria-hidden="true" style="width: 4px; height: 4px"></span>
    </a>
    <a href="Mobil-Ayarlar.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A9B5CF; font-size: 11.5px; font-weight: 600">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
      <span>Instellingen</span>
      <span aria-hidden="true" style="width: 4px; height: 4px"></span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { left: 1028, bells: { Imsak: false, Fajr: true, Sunrise: false, Dhuhr: true, Asr: true, Maghrib: true, Isha: true } };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      this.setState((s) => ({ left: s.left > 0 ? s.left - 1 : 1028 }));
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const s = this.state.left;
    const pad = (n) => String(n).padStart(2, '0');
    const countdown = Math.floor(s / 3600) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60);
    const base = [
      { key: 'Imsak', name: 'Imsak', ar: 'الإمساك', time: '06:28', st: 'past' },
      { key: 'Fajr', name: 'Fadjr', ar: 'الفجر', time: '07:15', st: 'past' },
      { key: 'Sunrise', name: 'Zonsopgang', ar: 'الشروق', time: '08:15', st: 'past' },
      { key: 'Dhuhr', name: 'Dhoehr', ar: 'الظهر', time: '13:30', st: 'past' },
      { key: 'Asr', name: 'Asr', ar: 'العصر', time: '15:59', st: 'past' },
      { key: 'Maghrib', name: 'Maghrib', ar: 'المغرب', time: '18:34', st: 'now' },
      { key: 'Isha', name: 'Isja', ar: 'العشاء', time: '20:09', st: 'next' }
    ];
    const rows = base.map((r, i) => {
      const on = !!this.state.bells[r.key];
      const isNext = r.st === 'next';
      return {
        ...r, isNext, isNow: r.st === 'now',
        color: r.st === 'past' ? '#A9B5CF' : (isNext ? '#F08B6E' : '#F3EEE3'),
        bellOn: on ? 'true' : 'false', bellOff: !on, bellOnFlag: on,
        bellColor: on ? '#A9C1FA' : '#A9B5CF',
        bellLabel: 'Melding ' + r.name + (on ? ' aan' : ' uit'),
        bg: isNext ? 'rgba(240,139,110,0.12)' : 'transparent',
        shadow: isNext ? 'none' : 'inset 0 -1px 0 rgba(232,194,122,0.16)',
        delay: (0.05 * i).toFixed(2) + 's',
        toggle: () => this.setState((st) => ({ bells: { ...st.bells, [r.key]: !st.bells[r.key] } }))
      };
    });
    return { countdown, rows };
  }
}
</script>
