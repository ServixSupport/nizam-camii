<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Programlar – tablet dikey</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
@keyframes nzRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="width: 820px; height: 1180px; position: relative; overflow: hidden; box-sizing: border-box; display: flex; background: #F6F1E7; color: #14295A; font-family: 'Hanken Grotesk', 'Segoe UI', system-ui, sans-serif">

  <nav aria-label="Ana menü" style="flex: 0 0 92px; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 26px 0; box-sizing: border-box; border-right: 1px solid #E3D8C4; background: #F1EADC">
    <img src="/_blob/1a2a267a69fa9a1be6ef7de516c1d69d" alt="Nizam-ı Alem Süleymaniye Camii logosu" style="width: 48px; height: 48px; object-fit: contain; margin-bottom: 22px">
    <a href="Tablet-Ana-ekran.dc.html" style="width: 78px; height: 70px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #4E5B76; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V11.5a7 7 0 0 1 7-8 7 7 0 0 1 7 8V21"></path><path d="M9.5 21v-5a2.5 2.5 0 0 1 5 0v5"></path><path d="M3 21h18"></path></svg>
      <span>Ana ekran</span>
    </a>
    <a href="Mobil-Faaliyetler.dc.html" style="width: 78px; height: 70px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #4E5B76; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path><path d="M12 12.6l1 2 2.2.3-1.6 1.5.4 2.2-2-1.1-2 1.1.4-2.2-1.6-1.5 2.2-.3z"></path></svg>
      <span>Faaliyetler</span>
    </a>
    <a href="Tablet-Programlar.dc.html" aria-current="page" style="width: 78px; height: 70px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; background: rgba(31,70,166,0.09); color: #1F46A6; font-size: 12px; font-weight: 700">
      <svg aria-hidden="true" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
      <span>Programlar</span>
    </a>
    <a href="Mobil-Ayarlar.dc.html" style="width: 78px; height: 70px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #4E5B76; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
      <span>Ayarlar</span>
    </a>
  </nav>

  <main style="flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; gap: 16px; padding: 26px 26px 24px 24px; box-sizing: border-box">

    <svg aria-hidden="true" width="300" height="200" viewBox="0 0 300 200" style="position: absolute; right: 0; top: 0; opacity: 0.16">
      <defs>
        <pattern id="nzStarProg" width="50" height="50" patternUnits="userSpaceOnUse">
          <g fill="none" stroke="#A8843A" stroke-width="1">
            <rect x="14" y="14" width="22" height="22"></rect>
            <rect x="14" y="14" width="22" height="22" transform="rotate(45 25 25)"></rect>
            <path d="M0 25h10M40 25h10M25 0v10M25 40v10"></path>
          </g>
        </pattern>
        <radialGradient id="nzFadeProg" cx="1" cy="0" r="1">
          <stop offset="0" stop-color="#fff" stop-opacity="1"></stop>
          <stop offset="1" stop-color="#fff" stop-opacity="0"></stop>
        </radialGradient>
        <mask id="nzMaskProg"><rect width="300" height="200" fill="url(#nzFadeProg)"></rect></mask>
      </defs>
      <rect width="300" height="200" fill="url(#nzStarProg)" mask="url(#nzMaskProg)"></rect>
    </svg>

    <header style="position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-family: 'Bodoni Moda', Georgia, serif; font-weight: 600; font-size: 40px; line-height: 1.05; letter-spacing: -0.01em">Programlar</h1>
        <p style="margin: 0; font-size: 15px; color: #4E5B76">Haftalık ders ve sohbet takvimi</p>
      </div>
      <div style="display: flex; align-items: center; gap: 6px">
        <sc-if value="{{notThisWeek}}" hint-placeholder-val="{{false}}">
          <button type="button" onClick="{{goToday}}" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #E3D8C4; background: #FFFDF8; color: #1F46A6; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">Bu hafta</button>
        </sc-if>
        <button type="button" aria-label="Önceki hafta" onClick="{{prevWeek}}" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #E3D8C4; background: #FFFDF8; color: #14295A; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
        </button>
        <span aria-live="polite" style="min-width: 150px; text-align: center; font-family: 'Bodoni Moda', Georgia, serif; font-weight: 600; font-size: 18px; font-variant-numeric: lining-nums">{{rangeLabel}}</span>
        <button type="button" aria-label="Sonraki hafta" onClick="{{nextWeek}}" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #E3D8C4; background: #FFFDF8; color: #14295A; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
        </button>
      </div>
    </header>

    <div style="position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div role="group" aria-label="Gruba göre filtrele" style="display: flex; gap: 6px; flex-wrap: wrap">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
          <button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="height: 40px; padding: 0 13px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-family: inherit; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 7px; cursor: pointer">
            <span aria-hidden="true" style="width: 8px; height: 8px; transform: rotate(45deg); background: {{c.dot}}; border-radius: 1px"></span>
            <span>{{c.label}}</span>
          </button>
        </sc-for>
      </div>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #4E5B76; white-space: nowrap">
        <span aria-hidden="true" style="width: 18px; border-top: 1.5px dashed #A8843A"></span>
        Namaz vakitleri
      </span>
    </div>

    <section aria-label="Haftalık program tablosu" style="position: relative; display: flex; flex-direction: column; border-radius: 22px; background: #FFFDF8; border: 1px solid #E3D8C4; overflow: hidden">

      <div style="display: flex; height: 52px; border-bottom: 1px solid #E3D8C4">
        <span style="flex: 0 0 46px"></span>
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <span style="flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0">
            <span style="display: flex; align-items: baseline; gap: 5px; padding: 6px 10px; border-radius: 999px; background: {{d.bg}}">
              <span style="font-size: 12px; font-weight: 700; color: {{d.fg}}">{{d.short}}</span>
              <span style="font-family: 'Bodoni Moda', Georgia, serif; font-weight: 600; font-size: 19px; font-variant-numeric: lining-nums; color: {{d.numColor}}">{{d.num}}</span>
            </span>
          </span>
        </sc-for>
      </div>

      <div style="position: relative; height: {{bodyH}}px">
        <sc-for list="{{hours}}" as="h" hint-placeholder-count="14">
          <span style="position: absolute; left: 46px; right: 0; top: {{h.top}}px; border-top: 1px solid #EEE5D5"></span>
          <span aria-hidden="{{h.hidden}}" style="position: absolute; left: 0; width: 40px; text-align: right; top: {{h.labelTop}}px; font-size: 11px; font-variant-numeric: tabular-nums; color: #6A7590; opacity: {{h.op}}">{{h.label}}</span>
        </sc-for>

        <div style="position: absolute; left: 46px; right: 0; top: 0; bottom: 0">
          <sc-for list="{{cols}}" as="col" hint-placeholder-count="6">
            <span style="position: absolute; top: 0; bottom: 0; left: {{col.left}}%; border-left: 1px solid #F1EADC"></span>
          </sc-for>
          <sc-if value="{{showToday}}" hint-placeholder-val="{{true}}">
            <span style="position: absolute; top: 0; bottom: 0; left: 71.4286%; width: 14.2857%; background: rgba(31,70,166,0.05)"></span>
          </sc-if>
          <sc-for list="{{prayers}}" as="p" hint-placeholder-count="4">
            <span style="position: absolute; left: 0; right: 0; top: {{p.top}}px; border-top: 1.5px dashed rgba(168,132,58,0.75)"></span>
          </sc-for>

          <sc-for list="{{blocks}}" as="b" hint-placeholder-count="14">
            <button type="button" aria-pressed="{{b.pressed}}" aria-label="{{b.label}}" onClick="{{b.pick}}" style="position: absolute; left: {{b.left}}%; top: {{b.top}}px; height: {{b.height}}px; width: calc(14.2857% - 6px); margin-left: 3px; box-sizing: border-box; padding: 5px 6px 5px 7px; border: 0; border-left: 3px solid {{b.color}}; border-radius: 12px 12px 4px 4px; background: {{b.bg}}; color: {{b.fg}}; opacity: {{b.op}}; box-shadow: {{b.shadow}}; font-family: inherit; text-align: left; display: flex; flex-direction: column; gap: 2px; overflow: hidden; cursor: pointer; transition: opacity .2s, background .2s; animation: nzRise .4s {{b.delay}} both">
              <span style="font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: {{b.timeColor}}">{{b.start}}</span>
              <span style="font-size: 12px; font-weight: 700; line-height: 1.18">{{b.title}}</span>
            </button>
          </sc-for>

          <sc-if value="{{showToday}}" hint-placeholder-val="{{true}}">
            <span aria-hidden="true" style="position: absolute; left: 71.4286%; width: 14.2857%; top: {{nowTop}}px; border-top: 2px solid #B5432B"></span>
            <span aria-hidden="true" style="position: absolute; left: calc(71.4286% - 4px); top: {{nowDotTop}}px; width: 9px; height: 9px; border-radius: 50%; background: #B5432B"></span>
          </sc-if>
        </div>

        <sc-for list="{{prayers}}" as="p" hint-placeholder-count="4">
          <span style="position: absolute; left: 0; width: 42px; text-align: right; top: {{p.labelTop}}px; font-size: 10.5px; font-weight: 700; color: #8A6A2A; background: #FFFDF8">{{p.name}}</span>
        </sc-for>
      </div>
    </section>

    <section aria-label="Seçili program" aria-live="polite" style="margin-top: auto; position: relative; display: flex; align-items: center; gap: 18px; padding: 18px 20px; border-radius: 24px; background: #14295A; color: #F6F1E7; overflow: hidden">
      <svg aria-hidden="true" width="200" height="200" viewBox="0 0 48 48" style="position: absolute; right: 120px; bottom: -110px; opacity: 0.12">
        <g fill="none" stroke="#E8C27A" stroke-width="0.6"><rect x="14" y="14" width="20" height="20"></rect><rect x="14" y="14" width="20" height="20" transform="rotate(45 24 24)"></rect></g>
      </svg>
      <div style="flex: 0 0 auto; width: 70px; height: 92px; box-sizing: border-box; border-radius: 35px 35px 10px 10px; border: 1px solid rgba(232,194,122,0.6); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #E8C27A">{{detail.dayShort}}</span>
        <span style="font-family: 'Bodoni Moda', Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1; font-variant-numeric: lining-nums">{{detail.num}}</span>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #D4DBEA">{{detail.month}}</span>
      </div>
      <div style="position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
        <span style="align-self: flex-start; display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; background: #F6F1E7; color: {{detail.color}}; font-size: 12px; font-weight: 700">
          <span aria-hidden="true" style="width: 7px; height: 7px; transform: rotate(45deg); background: {{detail.color}}"></span>{{detail.group}}
        </span>
        <span style="font-family: 'Bodoni Moda', Georgia, serif; font-weight: 600; font-size: 26px; line-height: 1.1">{{detail.title}}</span>
        <span style="font-size: 14.5px; color: #D4DBEA">{{detail.meta}}</span>
      </div>
      <button type="button" aria-pressed="{{detail.pressed}}" onClick="{{detail.toggle}}" style="position: relative; flex: 0 0 auto; height: 48px; padding: 0 18px; border-radius: 999px; border: 1px solid #E8C27A; background: {{detail.btnBg}}; color: {{detail.btnFg}}; font-family: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer">
        <sc-if value="{{detail.on}}" hint-placeholder-val="{{true}}">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M10.3 21a2 2 0 0 0 3.4 0z"></path></svg>
        </sc-if>
        <sc-if value="{{detail.off}}" hint-placeholder-val="{{false}}">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
        </sc-if>
        <span>{{detail.btnLabel}}</span>
      </button>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'cmt-genc', filter: 'Tümü', week: 0, remind: { 'cmt-genc': true, 'cum-cuma': true } };
  }
  renderVals() {
    const H = 58, START = 9, END = 22;
    const pad = (n) => String(n).padStart(2, '0');
    const fmt = (h) => pad(Math.floor(h)) + ':' + pad(Math.round((h % 1) * 60));
    const groups = {
      'Çocuklar': { color: '#8A6420', tint: 'rgba(138,100,32,0.13)' },
      'Gençlik': { color: '#0B6E6A', tint: 'rgba(11,110,106,0.13)' },
      'Hanımlar': { color: '#B5432B', tint: 'rgba(181,67,43,0.11)' },
      'Erkekler': { color: '#1F46A6', tint: 'rgba(31,70,166,0.11)' },
      'Herkes': { color: '#14295A', tint: 'rgba(20,41,90,0.10)' }
    };
    const kurs = { s: 17, e: 19, title: 'Kur’an kursu', place: 'Sınıflar · 7–14 yaş', group: 'Çocuklar' };
    const hsKurs = { s: 10, e: 13, title: 'Hafta sonu Kur’an kursu', place: 'Sınıflar · 7–14 yaş', group: 'Çocuklar' };
    const genc = { s: 19.5, e: 21, title: 'Gençlik sohbeti', place: 'Gençlik odası · 15–25 yaş', group: 'Gençlik' };
    const progs = [
      { id: 'pzt-kurs', d: 0, ...kurs },
      { id: 'pzt-tefsir', d: 0, s: 20.5, e: 21.5, title: 'Tefsir dersi', place: 'Ana salon', group: 'Erkekler', note: 'Yatsı sonrası' },
      { id: 'sal-hanim', d: 1, s: 10.5, e: 12, title: 'Hanımlar Kur’an dersi', place: 'Kadınlar bölümü', group: 'Hanımlar' },
      { id: 'sal-kurs', d: 1, ...kurs },
      { id: 'car-kurs', d: 2, ...kurs },
      { id: 'car-genc', d: 2, ...genc },
      { id: 'per-kurs', d: 3, ...kurs },
      { id: 'per-hadis', d: 3, s: 20.5, e: 21.5, title: 'Hadis dersi', place: 'Ana salon', group: 'Erkekler', note: 'Yatsı sonrası' },
      { id: 'cum-cuma', d: 4, s: 13.25, e: 14.25, title: 'Cuma namazı ve hutbe', place: 'Ana salon · hutbe özeti Nederlands', group: 'Herkes', note: 'Öğle vaktinde' },
      { id: 'cmt-kurs', d: 5, ...hsKurs },
      { id: 'cmt-ilmihal', d: 5, s: 14, e: 15.5, title: 'İlmihal dersi', place: 'Kadınlar bölümü', group: 'Hanımlar' },
      { id: 'cmt-genc', d: 5, ...genc },
      { id: 'paz-kurs', d: 6, ...hsKurs },
      { id: 'paz-hafiz', d: 6, s: 14, e: 16, title: 'Hafızlık hazırlık', place: 'Sınıf 3', group: 'Çocuklar' }
    ];
    const shorts = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
    const fulls = ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi', 'Pazar'];
    const months = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
    const week = this.state.week;
    const dates = shorts.map((_, i) => new Date(2026, 9, 19 + week * 7 + i));
    const first = dates[0], last = dates[6];
    const rangeLabel = first.getMonth() === last.getMonth()
      ? first.getDate() + ' – ' + last.getDate() + ' ' + months[last.getMonth()]
      : first.getDate() + ' ' + months[first.getMonth()] + ' – ' + last.getDate() + ' ' + months[last.getMonth()];
    const showToday = week === 0;

    const days = shorts.map((s, i) => {
      const today = showToday && i === 5;
      return { short: s, num: dates[i].getDate(), bg: today ? '#14295A' : 'transparent', fg: today ? '#F6F1E7' : '#4E5B76', numColor: today ? '#E8C27A' : '#14295A' };
    });
    const cols = [1, 2, 3, 4, 5, 6].map((i) => ({ left: (i * 100 / 7).toFixed(4) }));

    const prayerDefs = [
      { name: 'Öğle', h: 13.5 }, { name: 'İkindi', h: 15 + 59 / 60 }, { name: 'Akşam', h: 18 + 34 / 60 }, { name: 'Yatsı', h: 20 + 9 / 60 }
    ];
    const prayers = prayerDefs.map((p) => {
      const top = Math.round((p.h - START) * H);
      return { name: p.name, top, labelTop: top - 7 };
    });
    const hours = [];
    for (let h = START; h <= END; h++) {
      const near = prayerDefs.some((p) => Math.abs(p.h - h) < 0.25);
      const top = (h - START) * H;
      hours.push({ top, label: pad(h) + ':00', labelTop: h === START ? 4 : (h === END ? top - 16 : top - 7), op: near ? 0 : 1, hidden: near ? 'true' : 'false' });
    }

    const filter = this.state.filter;
    const blocks = progs.map((p, i) => {
      const g = groups[p.group];
      const sel = p.id === this.state.sel;
      const match = filter === 'Tümü' || p.group === filter;
      const range = fmt(p.s) + '–' + fmt(p.e);
      return {
        id: p.id, title: p.title, start: p.note ? p.note : fmt(p.s),
        left: (p.d * 100 / 7).toFixed(4), top: Math.round((p.s - START) * H) + 2, height: Math.round((p.e - p.s) * H) - 3,
        color: g.color, bg: sel ? g.color : g.tint, fg: sel ? '#FFFDF8' : '#14295A', timeColor: sel ? 'rgba(255,253,248,0.82)' : '#4E5B76',
        shadow: sel ? '0 6px 16px rgba(20,41,90,0.22)' : 'none',
        op: match ? 1 : 0.22, pressed: sel ? 'true' : 'false',
        label: fulls[p.d] + ', ' + range + ', ' + p.title + ', ' + p.group,
        delay: (0.03 * i).toFixed(2) + 's',
        pick: () => this.setState({ sel: p.id })
      };
    });

    const chipNames = ['Tümü', 'Çocuklar', 'Gençlik', 'Hanımlar', 'Erkekler', 'Herkes'];
    const chips = chipNames.map((n) => {
      const on = n === filter;
      const dot = n === 'Tümü' ? '#A8843A' : groups[n].color;
      return {
        label: n, pressed: on ? 'true' : 'false', dot: on ? (n === 'Tümü' ? '#E8C27A' : '#FFFDF8') : dot,
        bg: on ? (n === 'Tümü' ? '#14295A' : groups[n].color) : '#FFFDF8', fg: on ? '#FFFDF8' : '#14295A',
        border: on ? 'transparent' : '#E3D8C4',
        pick: () => this.setState({ filter: n })
      };
    });

    const sp = progs.find((p) => p.id === this.state.sel) || progs[0];
    const on = !!this.state.remind[sp.id];
    const range = fmt(sp.s) + '–' + fmt(sp.e);
    const detail = {
      dayShort: shorts[sp.d].toLocaleUpperCase('tr-TR'), num: dates[sp.d].getDate(),
      month: months[dates[sp.d].getMonth()].slice(0, 3).toLocaleUpperCase('tr-TR'),
      group: sp.group, color: groups[sp.group].color, title: sp.title,
      meta: fulls[sp.d] + ' · ' + (sp.note ? sp.note + ' (≈ ' + range + ')' : range) + ' · ' + sp.place,
      on, off: !on, pressed: on ? 'true' : 'false',
      btnBg: on ? '#E8C27A' : 'transparent', btnFg: on ? '#14295A' : '#E8C27A',
      btnLabel: on ? 'Hatırlatma açık' : 'Hatırlat',
      toggle: () => this.setState((st) => ({ remind: { ...st.remind, [sp.id]: !st.remind[sp.id] } }))
    };

    const nowH = 16 + 42 / 60;
    const nowTop = Math.round((nowH - START) * H);
    return {
      days, cols, hours, prayers, blocks, chips, detail, rangeLabel, showToday,
      notThisWeek: week !== 0,
      bodyH: (END - START) * H,
      nowTop, nowDotTop: nowTop - 3,
      prevWeek: () => this.setState((st) => ({ week: st.week - 1 })),
      nextWeek: () => this.setState((st) => ({ week: st.week + 1 })),
      goToday: () => this.setState({ week: 0 })
    };
  }
}
</script>
