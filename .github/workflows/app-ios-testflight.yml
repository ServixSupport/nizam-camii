# iPhone uygulamasını App Store Connect'e (TestFlight) yükler. Elle başlatılır: Actions → "iOS → TestFlight" → Run workflow.
# Apple Developer hesabı açıldıktan sonra kullanılır. Gerekli GitHub "Secrets" (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID              Apple Developer → Membership'teki Team ID (10 karakter)
#   APPSTORE_API_KEY_ID        App Store Connect → Users and Access → Integrations → Keys: anahtarın Key ID'si
#   APPSTORE_API_ISSUER_ID     aynı sayfadaki Issuer ID
#   APPSTORE_API_KEY_P8        indirilen .p8 dosyasının içeriği (BEGIN … END dahil)
# İmza (sertifika, profil, App Group) Apple'ın bulutunda otomatik oluşturulur (-allowProvisioningUpdates).
# Not: hesap olmadan denenemedi; ilk çalıştırmada hata çıkarsa günlüğe bakılır (app/README.md).
name: iOS → TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Web dosyaları ve Capacitor
        working-directory: app
        run: npm ci && node araclar/www.mjs && npx cap sync ios
      - name: App Store Connect anahtarı
        env:
          P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$P8" > ~/.appstoreconnect/private_keys/AuthKey.p8
      - name: Arşiv (sürüm numarası = çalıştırma numarası)
        working-directory: app/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey.p8 \
            -authenticationKeyID "${{ secrets.APPSTORE_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_API_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -40
      - name: App Store Connect'e yükle
        working-directory: app/ios/App
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey.p8 \
            -authenticationKeyID "${{ secrets.APPSTORE_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_API_ISSUER_ID }}"
      - name: Anahtarı sil
        if: always()
        run: rm -rf ~/.appstoreconnect
