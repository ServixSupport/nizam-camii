<script>
/* İlk boyamadan önce dil ve tema (ekran yanıp sönmesin). Ayrıntılı mantık app.js'te. */
(function () {
  try {
    var d = localStorage.getItem('nzm.dil');
    if (d === 'tr' || d === 'nl' || d === 'en') {
      /* uygulama adı dile göre: Süleymaniye Camii / Moskee / Mosque (ana ekran adı da) */
      var ad = { tr: 'Süleymaniye Camii', nl: 'Süleymaniye Moskee', en: 'Süleymaniye Mosque' }[d];
      document.documentElement.lang = d;
      document.title = ad;
      document.querySelector('link[rel="manifest"]').setAttribute('href', '/mobil/manifest-' + d + '.webmanifest');
      document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', ad);
    }
    if (localStorage.getItem('nzm.stil') !== 'klasik') document.documentElement.setAttribute('data-stil', 'liste');   // Tema 1 (liste) varsayılan
    var t = localStorage.getItem('nzm.tema');
    if (t !== 'gunduz' && t !== 'gece') {
      var h = +new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Amsterdam', hour: '2-digit', hourCycle: 'h23' }).format(new Date());
      t = (h >= 7 && h < 18) ? 'gunduz' : 'gece';
    }
    document.documentElement.setAttribute('data-tema', t);
  } catch (e) {}
})();
</script>
