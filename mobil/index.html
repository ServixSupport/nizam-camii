/* İlk boyamadan önce dil ve tema (ekran yanıp sönmesin). Ayrıntılı mantık app.js'te. */
(function () {
  try {
    var d = localStorage.getItem('nzm.dil');
    if (d === 'tr' || d === 'nl' || d === 'en') {
      /* uygulama adı dile göre: Süleymaniye Camii / Moskee / Mosque (ana ekran adı da) */
      var ad = { tr: 'Süleymaniye Camii', nl: 'Süleymaniye Moskee', en: 'Süleymaniye Mosque' }[d];
      document.documentElement.lang = d;
      document.title = ad;
      document.querySelector('link[rel="manifest"]').setAttribute('href', '/mobil/manifest-' + d + '.webmanifest');
      document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', ad);
    }
    var oz = new URLSearchParams(location.search).get('onizleme');   // tam ekran tema önizlemesi (tema-onizleme.js)
    var s = ['liste', 'gok', 'cini', 'zumrut'].indexOf(oz) >= 0 ? oz : localStorage.getItem('nzm.stil');
    if (s === 'klasik') s = 'gok';                                   /* eski Tema 2 (kemer) yerine gök (20-11-2026) */
    if (['liste', 'gok', 'zumrut'].indexOf(s) < 0) s = 'cini';       /* Tema 3 (cini) varsayılan (kullanıcı isteği, 11-11-2026) */
    document.documentElement.setAttribute('data-stil', s);
    /* sabit temalar (kullanıcı isteği, 20-11-2026): Otomatik / Açık / Koyu seçimi yok, her tema kendi (açık) haliyle */
    document.documentElement.setAttribute('data-tema', 'gunduz');
  } catch (e) {}
})();
</script>

      <section class="ayar">
        <h2 class="ayar-baslik" id="b-once-baslik" data-t="notifOnceBaslik"></h2>
        <div class="b-kart b-vliste" id="b-once-liste" role="group" aria-labelledby="b-once-baslik"></div>
      </section>
    </div>
  </section>

  <!-- ===== NAMAZ VAKTİNDE SESSİZE ALMA (#sessiz; kullanıcı isteği 20-11-2026, bildirimler sayfası gibi). yerel-ayar.js çizer; sadece Android -->
  <section class="sekme sayfa bildirimler" id="s-sessiz" data-sekme="sessiz" hidden>
    <a class="geri" href="#ayarlar">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      <span data-t="tabSettings"></span>
    </a>
    <div class="sayfa-bas"><h1 data-t="sessizAna"></h1></div>
    <div class="b-kart" id="sessiz-kart">
      <div class="b-satir">
        <span class="ad-ip"><span class="b-ana-ad" id="sessiz-ad" data-t="sessizAna"></span><button type="button" class="ipucu" aria-expanded="false" aria-controls="ip-sessiz" data-ip-ad="sessiz-ad"><span aria-hidden="true">?</span></button></span>
        <button type="button" class="anahtar" role="switch" aria-checked="false" aria-labelledby="sessiz-ad" id="sessiz-anahtar"><span aria-hidden="true"></span></button>
        <p class="ayar-not ipucu-not" id="ip-sessiz" data-t="sessizNot" hidden></p>
      </div>
      <p class="b-mesaj" id="sessiz-mesaj" role="status" hidden></p>
      <p class="b-mesaj bilgi" id="sessiz-son" hidden></p>   <!-- son sessize alma denemesi (yerel-ayar.js) -->
      <div class="b-satir" id="sessiz-izin-satir" hidden>
        <button type="button" class="dugme altin" id="sessiz-izin" data-t="izinVer"></button>
      </div>
      <div class="b-secenekler" id="sessiz-secenekler">
        <div class="b-satir dikey">
          <span class="b-ad" id="sessiz-mod-ad" data-t="sessizNasil"></span>
          <div class="b-once" role="group" aria-labelledby="sessiz-mod-ad" id="sessiz-mod"></div>
        </div>
        <!-- her namaz ayrı: açık/kapalı ve süre (yerel-ayar.js, kullanıcı isteği 19-11-2026) -->
        <div class="b-satir dikey">
          <span class="b-ad" id="sessiz-vakit-ad" data-t="sessizHangi"></span>
          <div class="b-namazlar" role="group" aria-labelledby="sessiz-vakit-ad" id="sessiz-vakitler"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== GİZLİLİK (#gizlilik; kullanıcı isteği 20-11-2026: web sitesine gidilmez). gizlilik.js çizer ===== -->
  <section class="sekme sayfa gizlilik" id="s-gizlilik" data-sekme="gizlilik" hidden>
    <a class="geri" href="#ayarlar">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      <span data-t="tabSettings"></span>
    </a>
    <div class="sayfa-bas"><h1></h1></div>
    <div class="gz-icerik"></div>
  </section>
</main>

<!-- Tema seçimi: tam ekran canlı önizleme, sağa sola kaydırılır (tema-onizleme.js) -->
<dialog class="tema-on" id="tema-on" data-t-aria="temaOnizleme">
  <div class="to-serit" id="to-serit"></div>
  <div class="to-alt">
    <button type="button" class="to-kapat" id="to-kapat" data-t-aria="kapat" autofocus><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="to-gez">
      <button type="button" id="to-onceki" data-t-aria="temaOnceki"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span id="to-ad" role="status"></span>
      <button type="button" id="to-sonraki" data-t-aria="temaSonraki"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <button type="button" class="dugme altin" id="to-sec"></button>
  </div>
</dialog>

<div class="surum-cubugu" id="surum-cubugu" role="status" hidden>
  <span data-t="newVersion"></span>
  <button type="button" class="dugme altin" id="surum-dugme" data-t="refresh"></button>
</div>
